name: Pages

# Manual only: publishing is a deliberate act, never a side effect of a push.
on:
  workflow_dispatch:

# Least privilege: only the deploy job can publish; the build job, which runs npm and the
# browser download, reads the repository and the Pages configuration and nothing more.
permissions:
  contents: read

# Python comes through uv from uv.lock; a lock that no longer matches pyproject.toml fails the run.
env:
  UV_LOCKED: '1'

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    env:
      PLAYWRIGHT_CHANNEL: chromium
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.6'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Release gate: every check below runs in this job, on this checkout,
      # so the deployed artifact is built from the exact SHA that passed them.
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run format:check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:release
      - run: uv run python scripts/atlas.py validate
      # The static site: native artefacts appear as screenshots; their runner stays local.
      - run: uv run python scripts/atlas.py build --target pages
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
